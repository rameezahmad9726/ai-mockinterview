name: Backend CI

on:
  push:
    branches: [ frontend_ ]
  pull_request:
    branches: [ frontend_ ]

jobs:
  lint-and-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install syntax checker
        run: pip install pyflakes

      - name: Check for Python syntax errors
        run: pyflakes backend/ || true
